<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 156 32" width="156" height="32" role="img" aria-label="Taskboard">
  <!-- 앱 아이콘: Action Blue 스퀘어클 + 칸반 기둥 3개 -->
  <rect x="0" y="0" width="32" height="32" rx="8" fill="#0066cc"/>
  <rect x="7" y="7" width="4.5" height="18" rx="2.25" fill="#ffffff"/>
  <rect x="13.75" y="7" width="4.5" height="12" rx="2.25" fill="#ffffff" fill-opacity="0.85"/>
  <rect x="20.5" y="7" width="4.5" height="15" rx="2.25" fill="#ffffff" fill-opacity="0.7"/>
  <!-- 워드마크: ink #1d1d1f, SF Pro Display Semibold, 좁은 자간 -->
  <text x="42" y="23.5" fill="#1d1d1f" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="600" letter-spacing="-0.5">Taskboard</text>
</svg>
